name: CI

# Runs the type checker and test suite on every PR and on pushes to main,
# so broken code is caught before it merges. Mirrors the Node version and
# install step already used by release.yml.

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Lint is informational for now — the codebase has a large backlog of
      # prettier/line-ending warnings (no errors). Surfaced but not gating,
      # so a warning backlog doesn't block merges.
      - name: Lint
        run: npm run lint
        continue-on-error: true

  # DEVLOG check: backstop for --no-verify and cloud sessions (AGENTS-WORKFLOW section 7).
  devlog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: DEVLOG touched
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'tasks/DEVLOG.md' || {
            echo "::error::Add a DEVLOG entry at the top of tasks/DEVLOG.md (format: AGENTS-WORKFLOW section 7)."
            exit 1
          }
